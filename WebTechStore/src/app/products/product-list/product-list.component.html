<main class="page">
  <h1 class="page-title">Cadastro de Produtos</h1>

  <div class="toolbar">
    <button mat-flat-button type="button" class="btn btn-incluir" (click)="openCreate()">Incluir</button>
  </div>

  <div class="grid-container">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Carregando produtos" />
    }

    <table mat-table class="product-grid" [dataSource]="products()" aria-label="Produtos cadastrados">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>

      <ng-container matColumnDef="categoryName">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let product">{{ product.categoryName }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef class="col-price">Preço</th>
        <td mat-cell *matCellDef="let product" class="col-price">{{ product.price | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="col-actions">Ações</th>
        <td mat-cell *matCellDef="let product" class="col-actions">
          <button
            mat-flat-button
            type="button"
            class="btn btn-alterar"
            [attr.aria-label]="'Alterar ' + product.name"
            (click)="openEdit(product)"
          >
            Alterar
          </button>
          <button
            mat-flat-button
            type="button"
            class="btn btn-excluir"
            [attr.aria-label]="'Excluir ' + product.name"
            (click)="confirmDelete(product)"
          >
            Excluir
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let product; columns: displayedColumns"
        [class.row-selected]="selectedId() === product.id"
        [class.row-deleting]="deletingId() === product.id"
        (click)="select(product)"
      ></tr>

      <tr class="mat-mdc-row empty-row" *matNoDataRow>
        <td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">
          @if (loadFailed()) {
            <span class="load-error">{{ messages.list.loadError }}</span>
            <button mat-button type="button" (click)="loadProducts()">Tentar novamente</button>
          } @else if (!loading()) {
            {{ messages.list.empty }}
          }
        </td>
      </tr>
    </table>
  </div>
</main>
